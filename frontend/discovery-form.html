<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Questionnaire | MMGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0a0d;
      --text:      #f2f2f5;
      --muted:     #9a9aa6;
      --orange:    #ff6a00;
      --orange-2:  #ff8a2a;
      --green:     #22d3a0;
      --red:       #ef4444;
      --line:      rgba(255,255,255,0.10);
      --field:     rgba(255,255,255,0.055);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── Backdrop: same reeded orange glass as Daily Standup ── */
    body{background:
      radial-gradient(900px 500px at -8% 110%, rgba(255,90,10,.10), transparent 70%),
      linear-gradient(180deg,#0a0605 0%,#060404 100%); background-attachment: fixed}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        repeating-linear-gradient(90deg, rgba(10,2,0,.62) 0px, rgba(10,2,0,.10) 8px, rgba(0,0,0,0) 18px, rgba(255,190,110,.10) 27px, rgba(10,2,0,.62) 38px),
        linear-gradient(90deg, rgba(0,0,0,0) 36%, rgba(110,18,0,.62) 56%, rgba(190,48,0,.88) 74%, rgba(255,100,8,1) 90%, rgba(255,150,30,1) 100%);
      -webkit-mask-image:radial-gradient(ellipse 78% 96% at 100% 2%, #000 24%, rgba(0,0,0,.5) 52%, rgba(0,0,0,.18) 74%, transparent 92%);
      mask-image:radial-gradient(ellipse 78% 96% at 100% 2%, #000 24%, rgba(0,0,0,.5) 52%, rgba(0,0,0,.18) 74%, transparent 92%)}
    body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(1100px 520px at 100% -12%, rgba(255,120,20,.30), transparent 62%)}

    .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }

    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.35rem; margin-bottom: 26px; }
    .brand svg { width: 26px; height: 26px; color: var(--orange); }
    .brand b { color: var(--orange-2); font-weight: 700; }

    .form-header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(1.9rem, 4.2vw, 2.8rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: 10px; }
    .form-header h1 span { color: var(--orange); }
    .form-header p { color: #d8d8e0; font-size: 1.02rem; line-height: 1.5; margin-bottom: 28px; }

    /* ── Glass shell ── */
    .shell {
      border-radius: 30px; padding: 32px 36px 34px;
      background:
        radial-gradient(560px 280px at 100% 100%, rgba(255,110,10,.14), transparent 70%),
        linear-gradient(160deg, rgba(255,255,255,.09) 0%, rgba(24,10,5,.66) 36%, rgba(14,6,3,.76) 100%);
      -webkit-backdrop-filter: blur(22px) saturate(105%); backdrop-filter: blur(22px) saturate(105%);
      border: 1px solid; border-color: rgba(255,255,255,.22) rgba(255,160,70,.30) rgba(255,140,50,.55) rgba(255,255,255,.14);
      box-shadow: 0 34px 80px rgba(0,0,0,.6), 0 18px 50px rgba(255,80,0,.18),
        inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,150,50,.5), inset 0 -50px 70px -50px rgba(255,100,10,.22);
    }

    /* ── Stepper ── */
    .stepper { display: flex; margin-bottom: 30px; }
    .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; text-align: center; font-size: .86rem; color: #d0d0d8; cursor: pointer; }
    .step::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: rgba(255,255,255,.22); z-index: 0; }
    .step:first-child::before { display: none; }
    .step.done::before, .step.on::before { background: var(--orange); }
    .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: #17151a; display: grid; place-items: center; position: relative; z-index: 1; }
    .dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .step.on .dot { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255,106,0,.18); }
    .step.on .dot::after { background: var(--orange); }
    .step.done .dot { background: var(--orange); border-color: var(--orange); }
    .step.done .dot::after { width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; border-radius: 0; background: none; transform: rotate(45deg) translate(-1px,-1px); }
    .step.on { color: #fff; font-weight: 600; }

    /* ── Section card ── */
    .q-card {
      display: none; border-radius: 22px; padding: 30px 36px 34px;
      background: linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.09); border-top: 3px solid var(--orange);
      box-shadow: 0 10px 26px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -10px 20px -14px rgba(0,0,0,.5);
    }
    .q-card.on { display: block; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .q-section-title { letter-spacing: -.3px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.55rem; font-weight: 700; color: var(--orange); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }

    .q-group { margin-bottom: 22px; }
    .q-group:last-child { margin-bottom: 0; }
    .q-group label { display: block; font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
    .q-group .required { color: #ff4d2e; margin-left: 4px; }
    .q-group a { color: var(--orange-2); font-size: .85rem; margin-left: 8px; }

    .q-input { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); color: #fff; padding: 18px 22px; border-radius: 18px; font-size: 1.02rem; width: 100%; outline: none; transition: border-color .2s, background .2s; font-family: inherit; box-shadow: inset 0 2px 8px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.06); }
    .q-input::placeholder { color: #7d7d88; }
    .q-input:focus { border-color: var(--orange); background: rgba(255,255,255,.075); box-shadow: 0 0 0 3px rgba(255,106,0,.14); }
    textarea.q-input { resize: vertical; min-height: 96px; }

    /* ── Nav buttons ── */
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; }
    .btn { border: none; padding: 18px 38px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .15s, box-shadow .2s, background .2s; }
    .btn-back { background: rgba(255,255,255,.09); color: #fff; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16); }
    .btn-back:hover { background: rgba(255,255,255,.14); }
    .btn-next { background: linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,106,0,.85) 85%,#ff6a00); border: 1px solid rgba(255,140,30,.5); border-radius: 18px; color: #fff; font-weight: 800; box-shadow: 0 18px 44px rgba(255,90,0,.42), inset 0 1px 0 rgba(255,210,150,.35), inset 0 -12px 24px -12px rgba(255,120,20,.5); margin-left: auto; }
    .btn-next:hover:not(:disabled) { background: linear-gradient(90deg,rgba(255,255,255,.14),#ff7a14 85%,#ff6a00); border-color: rgba(255,160,50,.7); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .count { color: var(--muted); font-size: .85rem; }

    .toast { position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%); background: var(--green); color: #000; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: .9rem; transition: bottom .3s cubic-bezier(.175,.885,.32,1.275); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
    .toast.show { bottom: 30px; }
    .toast.err { background: var(--red); color: #fff; }

    .success-msg { text-align: center; display: none; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--green); font-size: 2rem; margin-bottom: 14px; }
    .success-msg p { color: #d0d0d8; font-size: 1.05rem; }

    @media (max-width: 720px) {
      .container { padding: 22px 14px 40px; }
      .shell { padding: 20px 14px 22px; border-radius: 24px; }
      .q-card { padding: 22px 18px 26px; }
      .step span { display: none; }
      .step.on span { display: block; position: absolute; top: 40px; white-space: nowrap; }
      .stepper { margin-bottom: 44px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.5 7l17 10M3.5 17l17-10"/></svg>
    <div>MMGA <b>Lumina</b></div>
  </div>

  <div class="form-header">
    <h1>Discovery <span>Questionnaire</span></h1>
    <p>Help MMGA understand your business goals, workflows, and visual design preferences.</p>
  </div>

  <div id="loading" style="text-align:center; padding: 40px; color: var(--muted);">Loading questionnaire...</div>

  <div id="wrap" class="shell" style="display:none;">
    <div class="stepper" id="stepper"></div>

    <form id="discovery-form" onsubmit="submitForm(event)" novalidate>
      <!-- Identity step -->
      <div class="q-card" data-title="Your Details">
        <h3 class="q-section-title">Your Details</h3>
        <div class="q-group">
          <label>Company Name <span class="required">*</span></label>
          <input type="text" id="company_name" class="q-input" required placeholder="e.g. Acme Corp">
        </div>
        <div class="q-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" id="email" class="q-input" required placeholder="e.g. hello@acmecorp.com">
        </div>
      </div>

      <div id="dynamic-fields" style="display:contents;"></div>

      <div class="nav">
        <button type="button" class="btn btn-back" id="backBtn" onclick="go(-1)" style="visibility:hidden;">Back</button>
        <span class="count" id="count"></span>
        <button type="button" class="btn btn-next" id="nextBtn" onclick="go(1)">Next</button>
      </div>
    </form>
  </div>

  <div id="success-view" class="success-msg">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22d3a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 24px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    <h2>Thank You!</h2>
    <p>Your discovery questionnaire has been successfully submitted. We will review your answers and be in touch soon.</p>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  const API = (window.location.protocol === "file:" || !window.location.hostname)
    ? "http://localhost:5000"
    : (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:5000"
        : window.location.origin);

  let questions = [];
  let cur = 0;
  const urlParams = new URLSearchParams(window.location.search);
  const formId = urlParams.get('form_id') || 'discovery_global';

  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  async function loadForm() {
    const loading = document.getElementById('loading');
    try {
      const res = await fetch(`${API}/api/form-templates/${formId}`);
      const data = await res.json();
      if (data.success && data.template && data.template.length > 0) {
        questions = data.template;
        renderQuestions();
        loading.style.display = 'none';
        document.getElementById('wrap').style.display = 'block';
        buildStepper();
        show(0);
      } else {
        loading.innerHTML = '<div style="color:var(--muted);">No questionnaire has been configured yet.</div>';
      }
    } catch (e) {
      loading.innerHTML = `<div style="color:var(--red);">Error connecting to server.</div>`;
    }
  }

  function renderQuestions() {
    const container = document.getElementById('dynamic-fields');
    const sections = {};
    questions.forEach(q => {
      const s = q.section || "General";
      (sections[s] = sections[s] || []).push(q);
    });

    let html = '';
    for (const [sName, qs] of Object.entries(sections)) {
      html += `<div class="q-card" data-title="${escapeHtml(sName)}">
                 <h3 class="q-section-title">${escapeHtml(sName)}</h3>`;
      qs.forEach(q => {
        html += `
          <div class="q-group">
            <label>
              ${escapeHtml(q.label)}
              ${q.reference_link ? `<a href="${escapeHtml(q.reference_link)}" target="_blank" rel="noopener">Link</a>` : ''}
            </label>
            ${q.type === 'textarea'
              ? `<textarea id="q_${q.id}" class="q-input" placeholder="Type your answer here..."></textarea>`
              : `<input type="text" id="q_${q.id}" class="q-input" placeholder="Type your answer here...">`}
          </div>`;
      });
      html += `</div>`;
    }
    container.innerHTML = html;
  }

  function cards() { return Array.from(document.querySelectorAll('#discovery-form .q-card')); }

  function buildStepper() {
    const st = document.getElementById('stepper');
    st.innerHTML = cards().map((c, i) =>
      `<div class="step" onclick="jump(${i})"><div class="dot"></div><span>${escapeHtml(c.dataset.title)}</span></div>`
    ).join('');
  }

  // check required fields of one step; show it if invalid
  function stepValid(i) {
    const card = cards()[i];
    const bad = Array.from(card.querySelectorAll('input[required]')).find(el => !el.checkValidity());
    if (bad) {
      show(i);
      bad.reportValidity();
      showToast("Please fill in the required fields.", true);
      return false;
    }
    return true;
  }

  function jump(i) {
    for (let k = cur; k < i; k++) if (!stepValid(k)) return;
    show(i);
  }

  function go(d) {
    const last = cards().length - 1;
    if (d > 0 && !stepValid(cur)) return;
    if (d > 0 && cur === last) { document.getElementById('discovery-form').requestSubmit(); return; }
    show(Math.max(0, Math.min(last, cur + d)));
  }

  function show(i) {
    cur = i;
    const cs = cards();
    cs.forEach((c, k) => c.classList.toggle('on', k === i));
    document.querySelectorAll('#stepper .step').forEach((s, k) => {
      s.classList.toggle('on', k === i);
      s.classList.toggle('done', k < i);
    });
    document.getElementById('backBtn').style.visibility = i === 0 ? 'hidden' : 'visible';
    document.getElementById('nextBtn').textContent = i === cs.length - 1 ? 'Submit Answers' : 'Next';
    document.getElementById('count').textContent = `Step ${i + 1} of ${cs.length}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submitForm(e) {
    e.preventDefault();
    const company_name = document.getElementById('company_name').value.trim();
    const email = document.getElementById('email').value.trim();
    if (!company_name || !email || !document.getElementById('email').checkValidity()) {
      show(0);
      showToast("Please fill in your company name and a valid email.", true);
      return;
    }

    const answers = {};
    questions.forEach(q => {
      const el = document.getElementById(`q_${q.id}`);
      if (el) answers[q.id] = el.value.trim();
    });

    const btn = document.getElementById('nextBtn');
    btn.textContent = "Submitting...";
    btn.disabled = true;

    try {
      const res = await fetch(`${API}/api/discovery-submissions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ form_id: formId, company_name, email, answers })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('wrap').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        window.scrollTo(0, 0);
      } else {
        showToast(data.error || "Failed to submit form.", true);
        btn.textContent = "Submit Answers";
        btn.disabled = false;
      }
    } catch (err) {
      showToast("Network error submitting form.", true);
      btn.textContent = "Submit Answers";
      btn.disabled = false;
    }
  }

  function escapeHtml(unsafe) {
    return (unsafe == null ? "" : String(unsafe)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  document.addEventListener('DOMContentLoaded', loadForm);
</script>
</body>
</html>
