<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar | Agency Portal Assistant</title>
<script src="auth.js"></script>
<script src="shared-config.js"></script>
<script src="gcal.js"></script>
<style>
:root {
  --bg: #0a0a0f; --s1: #12121a; --s2: #1a1a26; --bdr: rgba(255,255,255,0.08);
  --txt: #e8e8f0; --muted: #6b6b8a; --acc: #8B5A2B;
  --green: #22d3a0; --yellow: #fbbf24; --red: #ef4444; --orange: #f97316;
  --rs: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; padding:24px; }
.wrap { max-width: 1280px; margin: 0 auto; }
.hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.hdr h1 { font-size:1.4rem; }
.nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:.85rem; }
.nav a:hover { color:var(--txt); }
.card { background:var(--s1); border:1px solid var(--bdr); border-radius:var(--rs); padding:18px; margin-bottom:18px; }
.balance-strip { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
.balance-item .num { font-size:1.6rem; font-weight:700; }
.balance-item .lbl { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.btn-convert { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:.8rem; cursor:pointer; margin-left:auto; }
.btn-convert:disabled { opacity:.4; cursor:default; }
.ot-hint { font-size:.72rem; color:var(--muted); margin-top:4px; }
#toast { display:none; position:fixed; bottom:20px; right:20px; padding:10px 16px; border-radius:8px; font-size:.85rem; z-index:999; }
#toast.ok { background:var(--green); color:#04241a; }
#toast.err { background:var(--red); color:#2a0505; }
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:998; }
.modal-bg.open { display:flex; }
.modal { background:var(--s1); border:1px solid var(--bdr); border-radius:var(--rs); padding:20px; width:340px; }
.modal h3 { margin-bottom:12px; font-size:1rem; }
.modal label { display:block; font-size:.75rem; color:var(--muted); margin:10px 0 4px; }
.modal select, .modal textarea, .modal input { width:100%; background:var(--s2); border:1px solid var(--bdr); color:var(--txt); border-radius:6px; padding:7px; font-size:.85rem; font-family:inherit; }
.mail-meta { display:flex; gap:10px; font-size:.82rem; padding:6px 0; border-bottom:1px solid var(--bdr); }
.mail-meta span { color:var(--muted); width:42px; }
.modal-actions { display:flex; gap:8px; margin-top:16px; }
.modal-actions button { flex:1; padding:8px; border-radius:6px; border:none; cursor:pointer; font-size:.85rem; }
.btn-submit { background:var(--acc); color:#fff; }
.btn-cancel { background:var(--s2); color:var(--txt); }
.pending-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--bdr); font-size:.82rem; }
.pending-row:last-child { border-bottom:none; }
.pending-actions button { padding:4px 10px; border-radius:6px; border:none; cursor:pointer; font-size:.75rem; margin-left:6px; }
.btn-approve { background:var(--green); color:#04241a; }
.btn-reject { background:var(--red); color:#2a0505; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Calendar</h1>
    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="standup.html">Daily Standup</a>
      <a href="office-calendar.html" id="oc-link" style="display:none;">Office Calendar</a>
    </div>
  </div>

  <div class="card">
    <div class="balance-strip" id="balance-strip">Loading…</div>
  </div>

  <div class="card" id="hr-panel" style="display:none;">
    <h3 style="margin-bottom:10px;">Pending Approvals</h3>
    <div id="pending-list"><div style="color:var(--muted);font-size:.82rem;">No pending requests.</div></div>
  </div>

  <div id="cal"></div>
  <div class="ot-hint" style="margin-top:8px;">Click a weekday to apply for leave. Public holidays and work-from-home / office days are set by HR.</div>
</div>

<div class="modal-bg" id="apply-modal">
  <div class="modal" style="width:520px;max-width:94vw;">
    <h3 id="apply-modal-date">Apply for leave</h3>
    <div class="mail-meta"><span>From</span><b id="apply-from"></b></div>
    <div class="mail-meta"><span>To</span><b id="apply-to"></b></div>
    <div style="display:flex;gap:8px;">
      <div style="flex:1"><label>Type</label>
        <select id="apply-type" oninput="rebuildMail()"><option value="full">Full Day</option><option value="half">Half Day</option></select></div>
      <div style="flex:1"><label>From date</label><input type="date" id="apply-start" lang="en-GB" oninput="rebuildMail()" /></div>
      <div style="flex:1"><label>Until (optional)</label><input type="date" id="apply-end" lang="en-GB" oninput="rebuildMail()" /></div>
    </div>
    <label>Reason</label>
    <input type="text" id="apply-reason" maxlength="200" placeholder="e.g. family function" oninput="rebuildMail()" />
    <label>Subject</label>
    <input type="text" id="apply-subject" maxlength="150" oninput="subjectTouched=true" />
    <label>Message (this is exactly what Noorish receives by email)</label>
    <textarea id="apply-body" rows="8" oninput="bodyTouched=true"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeApplyModal()">Cancel</button>
      <button class="btn-submit" onclick="submitApply()">Send request</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = location.hostname==="localhost"||location.hostname==="127.0.0.1" ? "http://localhost:5000" : location.origin;
const user = JSON.parse(localStorage.getItem("agency_portal_user")||"{}");
const UID = user.user_id;
if (!UID) window.location.href = "login.html";
// HR and the founders can approve (never their own request; the server enforces it)
const IS_HR = ["emp009", "emp001", "emp004"].includes(UID);
const IS_VIEWER = UID === "emp003";   // sees pending requests + the office calendar, can't decide

function toast(m,t="ok"){
  const e=document.getElementById("toast");
  e.textContent=m; e.className=t; e.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>e.style.display="none",2500);
}

let pickedDate = null;
if (IS_HR || IS_VIEWER) document.getElementById("oc-link").style.display = "";

const LAYERS = {
  holiday: {label:"Public holidays",   color:"#4cc38a"},
  wfh:     {label:"Work from home",    color:"#6ea8fe"},
  office:  {label:"In-person office",  color:"#c58af9"},
  event:   {label:"Events",            color:"#f6ae2d"},
  leave:   {label:"My leave",          color:"#f28b82"},
  worked:  {label:"My attendance",     color:"#fbbf24"},
  rejected:{label:"Rejected requests", color:"#9aa0a6"},
};
const OFFICE_LABEL = {holiday:"Public holiday", wfh:"Work from home", office:"In-person office", event:"Event"};
function fmt12(t){
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  return `${(h % 12) || 12}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`;
}

async function loadCalendarEvents(startISO, endISO){
  const s = GCal.parse(startISO), e = GCal.parse(endISO);
  const months = [];
  for (let d = new Date(s.getFullYear(), s.getMonth(), 1); d <= e; d = new Date(d.getFullYear(), d.getMonth()+1, 1))
    months.push([d.getFullYear(), d.getMonth()+1]);

  const [officeRes, ...monthRes] = await Promise.all([
    fetch(`${API}/api/office-calendar?start=${startISO}&end=${endISO}`).then(r => r.ok ? r.json() : {events:[]}).catch(() => ({events:[]})),
    ...months.map(([y,m]) => fetch(`${API}/api/leave/calendar?year=${y}&month=${m}`).then(r => r.ok ? r.json() : {days:{}}).catch(() => ({days:{}}))),
  ]);

  const out = [];
  (officeRes.events || []).forEach(x => out.push({
    source:x.kind,
    title: (x.kind === "event" && x.start_time ? fmt12(x.start_time) + " " : "") + (x.title || OFFICE_LABEL[x.kind]),
    start:x.start_date, end:x.end_date, raw:x,
    style: x.kind === "holiday" ? "fill" : "dot", color:LAYERS[x.kind].color,
  }));
  monthRes.forEach(res => Object.entries(res.days || {}).forEach(([ds, info]) => {
    if (ds < startISO || ds > endISO) return;
    const st = info.status;
    const half = info.leave_type === "half" ? "Half-day leave" : "Leave";
    if (st === "leave_approved")
      out.push({source:"leave", title: info.leave_type === "half" ? "Half-day leave (approved)" : "On leave (approved)", start:ds, end:ds, style:"fill", color:"#f28b82", leave:info});
    else if (st === "leave_pending")
      out.push({source:"leave", title:`${half} applied — awaiting approval`, start:ds, end:ds, style:"ring", color:"#fb923c", leave:info, pending:true});
    if (info.rejected)
      out.push({source:"rejected", title:"Leave request rejected", start:ds, end:ds, style:"ring", color:"#9aa0a6", rejectedDay:true});
    // a rejected request must not hide the day's real attendance: show both chips
    if (st === "full")
      out.push({source:"worked", title:`Full day worked${info.hours ? " ("+fmtHM(info.hours)+")" : ""}`, start:ds, end:ds, style:"dot", color:"#22d3a0"});
    else if (st === "half")
      out.push({source:"worked", title:`Half day worked${info.hours ? " ("+fmtHM(info.hours)+")" : ""}`, start:ds, end:ds, style:"dot", color:"#fbbf24"});
  }));
  return out;
}

const cal = GCal.create({
  root: document.getElementById("cal"),
  storageKey: "gcal_leave",
  sources: Object.entries(LAYERS).map(([id,l]) => ({id, label:l.label, color:l.color})),
  loadEvents: loadCalendarEvents,
  onDayClick: dstr => {
    const dow = GCal.parse(dstr).getDay();
    if (dow === 0 || dow === 6){ toast("Weekends don't need leave"); return; }
    openApplyModal(dstr);
  },
  onEventClick: ev => {
    if (ev.source === "rejected"){
      toast(`Your leave request for ${ev.start} was rejected. Check WhatsApp/email for the reason, or apply again.`);
    } else if (ev.source === "leave"){
      if (ev.pending) openCancelConfirm(ev.leave.leave_id, ev.start);
      else showApprovedInfo(ev.start, ev.leave && ev.leave.leave_id);
    } else if (ev.source === "event" && ev.raw){
      const r = ev.raw, t = r.start_time ? (r.end_time ? `${fmt12(r.start_time)} – ${fmt12(r.end_time)}` : fmt12(r.start_time)) : "";
      toast(`${r.title}${t ? " — " + t : ""}`);
    } else if (ev.source === "holiday" || ev.source === "wfh" || ev.source === "office"){
      toast(`${ev.title} — ${OFFICE_LABEL[ev.source]}`);
    }
  },
});
function renderCalendar(){ cal.refresh(); }

async function loadBalance(){
  try{
    const r = await fetch(`${API}/api/leave/balance?user_id=${encodeURIComponent(UID)}`);
    const d = await r.json();
    const otHours = d.ot_pending_hours || 0;
    const otThreshold = d.ot_conversion_hours || 24;
    const canConvert = otHours >= otThreshold;
    document.getElementById("balance-strip").innerHTML = `
      <div class="balance-item"><div class="num">${d.remaining}</div><div class="lbl">Remaining</div></div>
      <div class="balance-item"><div class="num">${d.used}</div><div class="lbl">Used (${d.year})</div></div>
      <div class="balance-item"><div class="num">${d.comp_earned}</div><div class="lbl">Comp-Off Earned</div></div>
      <div class="balance-item"><div class="num">${d.base}</div><div class="lbl">Base Pool</div></div>
      <div class="balance-item">
        <div class="num">${fmtHM(otHours)}</div>
        <div class="lbl">OT Hours Pending</div>
        <div class="ot-hint">${canConvert ? "Ready to convert" : `${fmtHM(otThreshold - otHours)} more needed`}</div>
      </div>
      <button class="btn-convert" id="convert-ot-btn" ${canConvert ? "" : "disabled"} onclick="convertOvertime()">Convert to Leave</button>
    `;
  }catch(e){ toast("Couldn't load balance","err"); }
}

async function convertOvertime(){
  const btn = document.getElementById("convert-ot-btn");
  if (btn){ btn.disabled = true; btn.textContent = "Converting…"; }
  try{
    const r = await fetch(`${API}/api/leave/convert-ot`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_id: UID}),
    });
    const d = await r.json();
    if (!r.ok){ toast(d.error || "Failed to convert","err"); await loadBalance(); return; }
    if (d.converted_days > 0){
      toast(`Converted ${d.converted_days} day(s) of leave — ${fmtHM(d.pending_hours)} still pending`);
    } else {
      toast("Not enough overtime hours yet","err");
    }
    await loadBalance();
  }catch(e){ toast("Network error","err"); await loadBalance(); }
}

async function loadPending(){
  if (!IS_HR && !IS_VIEWER) return;
  document.getElementById("hr-panel").style.display = "block";
  try{
    const r = await fetch(`${API}/api/leave/pending?user_id=${encodeURIComponent(UID)}`);
    const d = await r.json();
    const wrap = document.getElementById("pending-list");
    if (!d.pending || !d.pending.length){
      wrap.innerHTML = '<div style="color:var(--muted);font-size:.82rem;">No pending requests.</div>';
      return;
    }
    wrap.innerHTML = d.pending.map(p => {
      const who = esc(empName(p.user_id));
      const filedBy = p.created_by && p.created_by !== p.user_id
        ? ` — filed by ${esc(empName(p.created_by))}` : "";
      return `
      <div class="pending-row">
        <span>${who}${filedBy} — ${esc(p.start_date)}${p.start_date!==p.end_date?" to "+esc(p.end_date):""} (${esc(p.leave_type)})${p.reason?" — "+esc(p.reason):""}</span>
        <span class="pending-actions">${IS_HR ? `
          <button class="btn-approve" onclick="decide(${p.id},'approve')">Approve</button>
          <button class="btn-reject" onclick="decide(${p.id},'reject')">Reject</button>` : '<span style="color:var(--muted);font-size:.75rem;">view only</span>'}
        </span>
      </div>
    `;
    }).join("");
  }catch(e){ toast("Couldn't load pending requests","err"); }
}

// 10.52 -> "10h 31m"; 0.59 -> "35m". Decimal hours are hard to read.
function fmtHM(h){
  const mins = Math.max(0, Math.round((Number(h) || 0) * 60));
  const hh = Math.floor(mins / 60), mm = mins % 60;
  return hh ? `${hh}h ${String(mm).padStart(2,"0")}m` : `${mm}m`;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function empName(id){
  return (window.EMP_DICT && window.EMP_DICT[id]) || id;
}

async function decide(id, action){
  let reason = "";
  if (action === "reject"){
    reason = prompt("Reason for rejecting (optional — the person is told):") ;
    if (reason === null) return;   // cancelled
  }
  try{
    const r = await fetch(`${API}/api/leave/${id}/${action}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_id: UID, reason}),
    });
    const d = await r.json();
    if (!r.ok){ toast(d.error || "Failed", "err"); return; }
    toast(action === "approve" ? "Approved" : "Rejected");
    loadPending(); renderCalendar();
  }catch(e){ toast("Network error","err"); }
}

async function showApprovedInfo(dstr, leaveId){
  const today = new Date().toISOString().slice(0,10);
  if (leaveId && dstr > today){
    // your own approved leave that has not started yet can be cancelled
    if (!confirm(`Cancel your approved leave for ${dstr}? Your balance is refunded and the approvers are told.`)) return;
    try{
      const r = await fetch(`${API}/api/leave/${leaveId}/cancel`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user_id: UID}),
      });
      const d = await r.json();
      if (!r.ok){ toast(d.error || "Couldn't cancel", "err"); return; }
      toast("Leave cancelled");
      await loadBalance(); await renderCalendar();
    }catch(e){ toast("Network error","err"); }
    return;
  }
  toast(`${dstr} is an approved leave day. Ask an approver (Noorish, Vidit or Kshitij) if it needs to change.`);
}

let subjectTouched = false, bodyTouched = false;
const HR_NAME = "Noorish", HR_MAIL = "noorish@mmga.agency";
function myMail(){
  return (empName(UID) || UID).split(" ")[0].toLowerCase().replace(/[^a-z0-9]/g,"") + "@mmga.agency";
}
function prettyDate(s){
  const d = GCal.parse(s);
  return `${GCal.DOW[d.getDay()]}, ${d.getDate()} ${GCal.MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}
// Fill the email subject/message from the form, until the person edits that field by hand.
function rebuildMail(){
  const start = document.getElementById("apply-start").value || pickedDate;
  let end = document.getElementById("apply-end").value || start;
  if (end < start) end = start;
  const half = document.getElementById("apply-type").value === "half";
  const reason = document.getElementById("apply-reason").value.trim();
  const when = start === end ? prettyDate(start) : `${prettyDate(start)} to ${prettyDate(end)}`;
  const me = (empName(UID) || UID);
  if (!subjectTouched)
    document.getElementById("apply-subject").value = `${half ? "Half-day leave" : "Leave"} request — ${me} (${when})`;
  if (!bodyTouched)
    document.getElementById("apply-body").value =
      `Hi ${HR_NAME},\n\nI would like to apply for ${half ? "a half day of leave" : "leave"} on ${when}.\n` +
      (reason ? `\nReason: ${reason}\n` : "") + `\nThanks,\n${me}`;
}

function openApplyModal(dstr){
  pickedDate = dstr;
  subjectTouched = bodyTouched = false;
  document.getElementById("apply-modal-date").textContent = "Apply for leave";
  document.getElementById("apply-from").textContent = `${empName(UID) || UID} <${myMail()}>`;
  document.getElementById("apply-to").textContent = `${HR_NAME} <${HR_MAIL}>, cc Vidit, Kshitij`;
  document.getElementById("apply-reason").value = "";
  document.getElementById("apply-type").value = "full";
  document.getElementById("apply-start").value = dstr;
  document.getElementById("apply-end").value = "";
  rebuildMail();
  document.getElementById("apply-modal").classList.add("open");
}
function closeApplyModal(){ document.getElementById("apply-modal").classList.remove("open"); }

async function submitApply(){
  if (!pickedDate) return;
  const leave_type = document.getElementById("apply-type").value;
  const reason = document.getElementById("apply-reason").value;
  const start = document.getElementById("apply-start").value || pickedDate;
  let end = document.getElementById("apply-end").value || start;
  if (end < start) end = start;
  const email_subject = document.getElementById("apply-subject").value.trim();
  const email_body = document.getElementById("apply-body").value.trim();
  try{
    const r = await fetch(`${API}/api/leave/apply`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_id: UID, date: start, end_date: end, leave_type, reason, email_subject, email_body}),
    });
    const d = await r.json();
    if (!r.ok){ toast(d.error || "Failed to apply", "err"); return; }
    toast("Leave request sent to Noorish for approval");
    closeApplyModal();
    renderCalendar();
  }catch(e){ toast("Network error","err"); }
}

async function openCancelConfirm(leaveId, dstr){
  if (!confirm(`Cancel your pending leave request for ${dstr}?`)) return;
  try{
    const r = await fetch(`${API}/api/leave/${leaveId}/cancel`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_id: UID}),
    });
    const d = await r.json();
    if (!r.ok){ toast(d.error || "Failed to cancel", "err"); return; }
    toast("Request cancelled");
    await loadBalance();
    await renderCalendar();
  }catch(e){ toast("Network error","err"); }
}

(async () => {
  await loadEmployees();
  await loadBalance();
  await loadPending();
  await renderCalendar();
})();
</script>
</body>
</html>
